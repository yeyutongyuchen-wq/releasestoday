name: data-sync

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch and clean calendar JSON
        env:
          CALENDAR_SOURCE_URL: ${{ vars.CALENDAR_SOURCE_URL }}
        run: node scripts/fetch-global-games.js

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/games.json docs/games.json docs/index.html
          if git diff --staged --quiet; then
            echo "No calendar changes"
            exit 0
          fi
          git commit -m "auto: update global game data source"
          git push
